name: docs

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

# Prevent concurrent deploys from racing on the gh-pages branch
# (git: cannot lock ref 'refs/heads/gh-pages': reference already exists)
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_DIR: "gh-pages"

jobs:
  build_and_deploy:
    name: "Build and deploy site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Generate site using antora site action"
        uses: kameshsampath/antora-site-action@master
        with:
          antora_playbook: site.yml

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: ${{ env.SITE_DIR }}
          branch: gh-pages
          clean: true
          force: true
          commit-message: "[CI] Publish Documentation for ${{ github.sha }}"
