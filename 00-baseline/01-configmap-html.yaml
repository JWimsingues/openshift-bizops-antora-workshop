# configmap-html.yaml
# Purpose: Minimal index.html so httpd returns HTTP 200 for probes and Route checks
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-html
  namespace: bizops-demo
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: bizops-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>BizOps demo</title></head>
      <body><h1>BizOps workshop demo</h1></body>
    </html>
