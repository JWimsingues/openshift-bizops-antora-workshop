# service.yaml
# Purpose: ClusterIP Service that selects demo-app pods on port 8080
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: bizops-demo
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: bizops-demo
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
