# route.yaml
# Purpose: OpenShift Route exposing demo-app externally over HTTP
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo-app
  namespace: bizops-demo
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: bizops-demo
spec:
  to:
    kind: Service
    name: demo-app
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
