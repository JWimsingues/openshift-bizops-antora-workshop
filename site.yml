runtime:
  cache_dir: ./.cache/antora

site:
  title: OpenShift BizOps Operations Workshop
  url: https://example.github.io/openshift-bizops-workshop
  start_page: openshift-bizops-workshop::index.adoc

content:
  sources:
    - url: .
      branches: [main, master]
      start_path: documentation

asciidoc:
  attributes:
    release-version: master
    page-pagination: true
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/redhat-scholars/course-ui/releases/download/v0.1.14/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./gh-pages
