# crashloop-deployment.yaml
# Purpose: Deployment that exits immediately to produce CrashLoopBackOff for labs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-app
  namespace: bizops-demo
  labels:
    app: crash-app
    app.kubernetes.io/name: crash-app
    app.kubernetes.io/part-of: bizops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-app
  template:
    metadata:
      labels:
        app: crash-app
        app.kubernetes.io/name: crash-app
        app.kubernetes.io/part-of: bizops-demo
    spec:
      containers:
        - name: crash
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args: ["echo starting; exit 1"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
