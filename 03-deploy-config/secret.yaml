# secret.yaml
# Purpose: Opaque Secret holding a sample token (workshop-only value, not production)
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secret
  namespace: bizops-demo
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: bizops-demo
type: Opaque
stringData:
  token: workshop-demo-token-change-me
