# resourcequota.yaml
# Purpose: Cap CPU, memory, and pod count for the tenant-a namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: bizops-tenant-a
  labels:
    app.kubernetes.io/part-of: bizops-demo
    tenant: team-a
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
